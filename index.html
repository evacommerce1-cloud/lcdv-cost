<style>
  :root{
    /* LEÇON DE VIE — pure white, ink black, minimal editorial */
    --paper:#FFFFFF;        /* page background, pure white */
    --surface:#FFFFFF;      /* card surface */
    --surface-2:#F6F6F4;    /* subtle fill for zebra/hover */
    --ink:#111111;          /* near-black text */
    --ink-soft:#4A4A4A;
    --sage:#111111;         /* accent → ink (was olive); underlines, active */
    --sage-deep:#000000;    /* strongest accent → pure black */
    --clay:#111111;         /* figures accent → ink (no warm tone) */
    --line:#D0D0CC;         /* borders — crisper */
    --line-soft:#E2E2DF;
    --line-strong:#A8A8A3;
    --line-black:#111111;   /* structural lines — card outline, section dividers, table frame */
    --muted:#99999900;
    --muted-txt:#8A8A86;
    --radius:2px;
    --f-display:'Inter','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --f-serif:'Inter','Noto Sans KR',sans-serif;
    --f-sans:'Inter','Noto Sans KR',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    --f-mono:ui-monospace,'SFMono-Regular','Consolas',monospace;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper);
    color:var(--ink);
    font-family:var(--f-sans);
    font-size:13.5px;
    font-weight:400;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
    letter-spacing:.01em;
  }
  .mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;}
  ::selection{background:var(--sage);color:#fff;}

  /* ---------- topbar ---------- */
  .topbar{
    position:sticky;top:0;z-index:50;
    display:flex;align-items:center;justify-content:space-between;
    padding:20px 30px 16px;
    background:var(--paper);
    border-bottom:1.5px solid var(--line-black);
  }
  .brand{display:flex;flex-direction:column;gap:1px;}
  .brand-name{
    font-family:var(--f-display);font-weight:600;font-size:18px;
    letter-spacing:.22em;line-height:1;color:var(--ink);text-transform:uppercase;
  }
  .brand-sub{
    font-family:var(--f-sans);font-size:9.5px;font-weight:400;
    letter-spacing:.34em;color:var(--muted-txt);text-transform:uppercase;margin-top:4px;
  }
  .tabs{display:flex;gap:2px;align-items:center;}
  .tab-btn{
    font-family:var(--f-sans);font-size:12px;font-weight:400;letter-spacing:.04em;
    background:transparent;border:none;color:var(--muted-txt);
    padding:8px 16px;cursor:pointer;transition:color .18s ease;position:relative;
  }
  .tab-btn:hover{color:var(--ink);}
  .tab-btn.active{color:var(--ink);font-weight:500;}
  .tab-btn.active::after{
    content:'';position:absolute;left:16px;right:16px;bottom:0;height:2px;background:var(--line-black);
  }
  .conn-badge{font-family:var(--f-mono);font-size:9.5px;letter-spacing:.05em;color:var(--muted-txt);display:flex;align-items:center;margin-left:14px;padding-left:14px;border-left:1px solid var(--line);}
  .conn-dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:6px;}
  .conn-ok{background:#8FA382;} .conn-bad{background:#C99;}

  #main{max-width:1280px;margin:0 auto;padding:26px 30px 130px;}

  /* ---------- cards ---------- */
  .card{
    background:var(--surface);
    border:1px solid var(--line-black);
    border-radius:var(--radius);
    padding:20px 22px;
    margin-bottom:16px;
  }
  .eyebrow{
    font-family:var(--f-sans);font-size:10px;font-weight:500;letter-spacing:.2em;
    color:var(--sage-deep);text-transform:uppercase;
    margin-bottom:16px;padding-bottom:11px;
    border-bottom:1.5px solid var(--line-black);
    display:flex;justify-content:space-between;align-items:baseline;
  }
  .eyebrow .aux{font-weight:400;color:var(--muted-txt);letter-spacing:.04em;text-transform:none;font-size:11px;}
  label{display:block;font-size:11px;color:var(--muted-txt);margin-bottom:13px;letter-spacing:.03em;}
  label input, label select{margin-top:5px;}
  input, select, textarea{
    width:100%;
    font-family:var(--f-sans);font-size:13px;color:var(--ink);
    background:#FFFFFF;
    border:1px solid var(--line-strong);
    border-radius:2px;
    padding:8px 10px;
    outline:none;
    transition:border-color .14s ease, box-shadow .14s ease;
  }
  input::placeholder, textarea::placeholder{color:#B8B8B3;}
  input:focus, select:focus, textarea:focus{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);background:#fff;}
  input[type=number]{font-family:var(--f-mono);text-align:right;}
  input[type=number]::-webkit-inner-spin-button{opacity:.35;}
  select{cursor:pointer;}

  /* ---------- buttons ---------- */
  .btn{
    font-family:var(--f-sans);font-size:12px;font-weight:400;letter-spacing:.03em;
    padding:8px 16px;border-radius:2px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink-soft);cursor:pointer;
    transition:all .14s ease;
  }
  .btn:hover{border-color:var(--sage);color:var(--ink);}
  .btn.primary{background:var(--sage-deep);color:#FFFFFF;border-color:var(--sage-deep);}
  .btn.primary:hover{background:var(--ink);border-color:var(--ink);color:#fff;}
  .btn.danger{color:var(--clay);border-color:#D8C4B8;}
  .btn.danger:hover{background:var(--clay);color:#fff;border-color:var(--clay);}
  .btn.small{padding:5px 11px;font-size:11px;}
  .mini-del,.mini-x{
    font-family:var(--f-sans);font-size:11px;color:var(--muted-txt);
    background:transparent;border:none;cursor:pointer;padding:2px 5px;transition:color .12s;
  }
  .mini-del:hover,.mini-x:hover{color:var(--clay);}
  button.danger-armed{background:var(--clay)!important;color:#fff!important;border-color:var(--clay)!important;}

  /* ---------- editor layout ---------- */
  .editor-grid{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start;}
  @media (max-width:900px){.editor-grid{grid-template-columns:1fr;}}

  .dropzone{
    border:1px dashed var(--line);border-radius:2px;
    padding:24px 10px;text-align:center;color:var(--muted-txt);font-size:11.5px;letter-spacing:.03em;
    cursor:pointer;transition:border-color .16s ease, background .16s ease;background:var(--surface-2);
  }
  .dropzone:hover{border-color:var(--sage);background:#fff;}
  .thumb-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:11px;}
  .thumb{position:relative;width:74px;height:74px;border-radius:2px;overflow:hidden;border:1px solid var(--line);}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .thumb button{
    position:absolute;top:3px;right:3px;width:18px;height:18px;line-height:16px;
    border-radius:50%;border:none;background:rgba(42,42,40,.6);color:#fff;font-size:12px;cursor:pointer;
  }

  /* ---------- tables ---------- */
  table{width:100%;border-collapse:collapse;font-size:12.5px;}
  th{
    font-family:var(--f-sans);font-size:9.5px;font-weight:500;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted-txt);text-align:left;
    padding:7px 6px;border-bottom:1.5px solid var(--line-black);white-space:nowrap;color:var(--ink);
  }
  td{padding:4px 5px;border-bottom:1px solid var(--line-soft);vertical-align:middle;}
  td input{padding:6px 8px;font-size:12.5px;background:#fff;border:1px solid var(--line);}
  td input:focus{background:#fff;border-color:var(--ink);box-shadow:0 0 0 1px var(--ink);}
  tfoot td{border-top:1px solid var(--ink);border-bottom:none;font-weight:500;padding-top:9px;}
  .readout{font-family:var(--f-mono);text-align:right;color:var(--ink-soft);font-variant-numeric:tabular-nums;}
  .readout.strong{font-weight:500;color:var(--ink);}
  .csz-table th, .csz-table td{text-align:center;}
  .csz-table td:first-child, .csz-table th:first-child{text-align:left;}
  .row-actions{display:flex;justify-content:space-between;align-items:center;margin-top:12px;gap:10px;flex-wrap:wrap;}
  .inline-add-size{display:flex;gap:6px;}
  .inline-add-size input{width:150px;}

  .pack-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px 14px;}
  .pack-field{margin-bottom:0;}
  .subtotal-line{
    display:flex;justify-content:space-between;align-items:baseline;
    margin-top:14px;padding-top:12px;border-top:1px solid var(--line);
    font-weight:500;color:var(--ink);font-size:12px;letter-spacing:.04em;
  }
  .subtotal-line .readout{font-size:15px;}

  .summary-card{background:var(--surface);}
  .summary-card table{font-size:13px;}
  .summary-card td{padding:9px 4px;border-bottom:1px solid var(--line-soft);}
  .summary-card td:first-child{color:var(--muted-txt);letter-spacing:.03em;}
  .summary-card td:last-child{text-align:right;}
  .summary-card tr.grand td{border-top:1px solid var(--ink);font-family:var(--f-display);font-weight:500;font-size:19px;color:var(--ink);padding-top:13px;}
  .summary-card tr.grand td:first-child{font-family:var(--f-sans);font-size:12px;letter-spacing:.06em;}
  .summary-card tr.mult-row td{padding-top:11px;}
  .summary-card tr.mult-row td:first-child{color:var(--ink);font-weight:500;letter-spacing:.05em;}
  .summary-card tr.mult-row #sum-multiple{font-family:var(--f-display);font-size:22px;font-weight:600;color:var(--clay);}

  .insight-card{background:var(--surface-2);border-color:var(--line);}
  .insight-card .ins-row{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:12px;color:var(--ink-soft);}
  .insight-card .ins-row:last-child{margin-bottom:0;}
  .insight-card .ins-row b{font-family:var(--f-mono);font-size:14px;color:var(--ink);font-weight:500;}

  .actions-bar{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px;align-items:center;}
  .quick-load{position:relative;}
  .load-panel{position:absolute;top:calc(100% + 6px);right:0;width:440px;max-width:90vw;background:var(--surface);border:1px solid var(--line);border-radius:4px;box-shadow:0 12px 32px rgba(42,42,40,.18);z-index:45;display:none;overflow:hidden;}
  .load-panel.show{display:block;}
  .load-panel-filters{display:flex;gap:8px;align-items:center;padding:12px 14px;border-bottom:1px solid var(--line-soft);background:var(--surface-2);}
  .load-panel-filters select{font-family:var(--f-sans);font-size:12px;padding:7px 9px;border:1px solid var(--line);background:#fff;border-radius:2px;flex:1;}
  .lp-count{font-family:var(--f-mono);font-size:10.5px;color:var(--muted-txt);white-space:nowrap;}
  .lp-list{max-height:340px;overflow-y:auto;}
  .ql-item{display:flex;align-items:center;gap:9px;padding:9px 14px;cursor:pointer;border-bottom:1px solid var(--line-soft);transition:background .1s;}
  .ql-item:hover{background:var(--surface-2);}
  .ql-item:last-child{border-bottom:none;}
  .ql-style{font-family:var(--f-mono);font-size:11px;color:var(--muted-txt);min-width:90px;}
  .ql-name{font-size:12.5px;color:var(--ink);flex:1;}
  .ql-empty{padding:20px 12px;color:var(--muted-txt);font-size:12px;text-align:center;}

  /* ---------- signature: cost seal (hangtag reimagined) ---------- */
  .cost-seal{
    position:fixed;right:28px;bottom:28px;z-index:60;
    width:232px;background:var(--surface);
    border:1px solid var(--line);border-radius:4px;
    padding:0 20px 18px;
    box-shadow:0 16px 46px rgba(42,42,40,.20);
    animation:sealIn .5s cubic-bezier(.2,.7,.2,1);
  }
  @keyframes sealIn{from{opacity:0;transform:translateY(12px);}to{opacity:1;transform:translateY(0);}}
  .seal-handle{
    display:flex;align-items:center;justify-content:space-between;
    margin:0 -20px 8px;padding:8px 14px;border-bottom:1px solid var(--line-soft);
    cursor:grab;user-select:none;background:var(--surface-2);border-radius:4px 4px 0 0;
    font-family:var(--f-sans);font-size:9.5px;letter-spacing:.14em;color:var(--muted-txt);text-transform:uppercase;
  }
  .seal-handle:active{cursor:grabbing;}
  .seal-handle .dots{letter-spacing:2px;color:var(--line-strong,#C7C2B2);}
  .seal-label{font-family:var(--f-sans);font-size:10px;letter-spacing:.2em;color:var(--muted-txt);text-transform:uppercase;margin-top:10px;}
  .seal-value{font-family:var(--f-display);font-weight:600;font-size:34px;color:var(--ink);line-height:1.05;margin-top:3px;}
  .seal-value .cur{font-size:15px;color:var(--muted-txt);margin-left:4px;font-weight:400;}
  .seal-sub{font-family:var(--f-sans);font-size:12px;color:var(--ink-soft);margin-top:13px;display:flex;justify-content:space-between;letter-spacing:.02em;align-items:baseline;}
  .seal-sub .mono{color:var(--ink);font-size:14px;}
  .seal-sub.mult{align-items:baseline;margin-top:11px;padding-top:11px;border-top:1px solid var(--line-soft);}
  .seal-sub.mult .lbl{align-self:center;}
  .seal-sub.mult .mono{font-family:var(--f-display);font-size:30px;font-weight:600;color:var(--clay);line-height:1;}
  @media (max-width:680px){.cost-seal{display:none;}}

  /* ============ 모바일 최적화 (스마트폰 목록·조회 위주) ============ */
  @media (max-width:640px){
    /* 상단바: 세로로 쌓고 탭은 가로 스크롤 */
    .topbar{flex-direction:column;align-items:stretch;gap:10px;padding:14px 16px 0;}
    .brand{align-items:center;text-align:center;}
    .brand-name{font-size:16px;letter-spacing:.18em;}
    .brand-sub{font-size:8.5px;letter-spacing:.24em;}
    .tabs{overflow-x:auto;white-space:nowrap;border-top:1px solid var(--line);padding-top:6px;-webkit-overflow-scrolling:touch;gap:0;}
    .tab-btn{flex:0 0 auto;padding:10px 14px;font-size:13px;}
    .conn-badge{margin-left:auto;border-left:none;padding-left:0;font-size:9px;}
    .current-user{display:none;}

    #main{padding:16px 12px 120px;}

    /* 카드: 여백 축소 */
    .card{padding:16px 14px;}

    /* 검색 툴바: 세로 정렬 */
    .search-toolbar{flex-direction:column;align-items:stretch;gap:8px;}
    .search-toolbar select, .search-toolbar .search-input{width:100%;}
    .search-toolbar .btn{width:100%;}

    /* 통계 카드: 3개 → 가로 유지하되 축소 */
    .stat-row{gap:8px;}
    .stat-card{padding:12px 8px;}
    .stat-num{font-size:17px;}
    .stat-label{font-size:8.5px;}

    /* 시즌 탭: 가로 스크롤 */
    .season-tabs{overflow-x:auto;white-space:nowrap;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;padding-bottom:12px;}
    .season-tab, .season-add{flex:0 0 auto;}

    /* ── 목록 표 → 모바일에서는 카드형으로 ── */
    .list-table thead{display:none;}                 /* 헤더 숨김 */
    .list-table, .list-table tbody, .list-table tr, .list-table td{display:block;width:100%;}
    .list-table{border:none;background:transparent;}
    .list-table tbody tr{
      background:var(--surface);border:1px solid var(--line-black);border-radius:3px;
      margin-bottom:10px;padding:12px 14px;position:relative;
    }
    .list-table tbody tr:hover{background:var(--surface);}
    .list-table td{padding:2px 0;border:none;text-align:left!important;}
    /* 썸네일 칸 */
    .list-table td:first-child{position:absolute;top:12px;right:12px;width:auto;padding:0;}
    .list-table td:first-child .row-thumb{width:48px;height:48px;}
    .list-table td:first-child .row-thumb.placeholder{width:48px;height:48px;}
    /* 라벨 붙이기 (모바일에서만) */
    .list-table td::before{content:attr(data-m);font-size:9.5px;color:var(--muted-txt);letter-spacing:.08em;text-transform:uppercase;margin-right:6px;}
    .list-table td.readout{display:inline-block;width:auto;margin-right:16px;font-size:13px;}
    .list-table td .list-style-no{font-size:12px;}
    .list-table td .list-item-name{font-size:15px;font-weight:600;}
    .list-table td .list-sale-name{font-size:12.5px;}
    .round-badge{font-size:9px;}
    .expand-hint{display:inline-block;margin-top:4px;}

    /* 차수 상세행도 카드 안에 */
    .child-row{border-left:2px solid var(--line-strong)!important;margin-left:0;}

    /* 작성 화면 요소들 */
    .actions-bar{gap:6px;}
    .actions-bar .btn{flex:1 1 auto;font-size:12px;padding:9px 8px;}
    .quick-load{width:100%;}
    .load-panel{width:100%;right:0;left:0;}

    /* 표(작성)의 가로 스크롤 허용 */
    .table-scroll{overflow-x:auto;-webkit-overflow-scrolling:touch;position:relative;box-shadow:inset -14px 0 12px -12px rgba(0,0,0,.18);}
    /* 작성 화면 표는 좁은 화면에서 칸이 뭉개지지 않도록 최소폭 부여 → 가로 스크롤 */
    .card .table-scroll table{min-width:600px;}
    .card table th, .card table td{white-space:nowrap;}
    .card table td input{min-width:60px;}

    /* 백업 바 */
    .backup-bar .btn{flex:1 1 auto;}

    /* 입력 폰트 크게(모바일 확대 방지: 16px) */
    input, select, textarea{font-size:16px;}
    td input{font-size:15px;}
  }

  /* ---------- search tab ---------- */
  .search-toolbar{display:flex;gap:10px;margin-bottom:20px;flex-wrap:wrap;align-items:center;}
  .season-tabs{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--line-soft);}
  .season-tab{font-family:var(--f-sans);font-size:12px;letter-spacing:.03em;padding:6px 15px;border:1px solid var(--line);background:var(--surface);color:var(--muted-txt);border-radius:999px;cursor:pointer;transition:all .14s ease;}
  .season-tab:hover{border-color:var(--sage);color:var(--ink);}
  .season-tab.active{background:var(--sage-deep);border-color:var(--sage-deep);color:#F2F0EA;font-weight:500;}
  .season-add{font-family:var(--f-sans);font-size:11.5px;padding:6px 12px;border:1px dashed var(--line-strong);background:transparent;color:var(--sage-deep);border-radius:999px;cursor:pointer;margin-left:4px;}
  .season-add:hover{border-color:var(--sage);background:var(--surface-2);}
  .season-chip{display:inline-block;font-size:9.5px;padding:1px 7px;border-radius:3px;background:var(--surface-2);border:1px solid var(--line);color:var(--sage-deep);letter-spacing:.03em;margin-right:5px;font-family:var(--f-mono);}
  .search-input{flex:1;min-width:220px;}
  .stat-row{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;margin-bottom:22px;background:var(--line-soft);border:1px solid var(--line-soft);border-radius:2px;overflow:hidden;}
  .stat-card{background:var(--surface);padding:18px 18px;}
  .stat-num{font-family:var(--f-display);font-size:26px;font-weight:500;color:var(--ink);line-height:1;}
  .stat-label{font-size:10px;color:var(--muted-txt);margin-top:6px;letter-spacing:.14em;text-transform:uppercase;}
  .list-table{background:var(--surface);border:1px solid var(--line-black);border-radius:2px;}
  .list-table th, .list-table td{padding:11px 12px;}
  .list-table th.sortable{cursor:pointer;user-select:none;transition:color .12s;white-space:nowrap;}
  .list-table th.sortable:hover{color:var(--ink);}
  .list-table th.num{text-align:right;}
  .sort-arr{color:var(--line-strong,#C7C2B2);font-size:10px;margin-left:3px;}
  .sort-arr.on{color:var(--sage-deep);}
  .list-table tbody tr td{font-size:13px;}
  .season-tab-wrap{display:inline-flex;align-items:center;position:relative;}
  .season-del{border:none;background:transparent;color:var(--muted-txt);font-size:14px;cursor:pointer;padding:0 4px;margin-left:-6px;border-radius:50%;line-height:1;}
  .season-del:hover{color:var(--clay);}
  .season-del[data-armed="1"]{background:var(--clay);color:#fff;font-weight:700;}
  .current-user{font-family:var(--f-sans);font-size:11px;color:var(--sage-deep);margin-left:14px;padding-left:14px;border-left:1px solid var(--line);letter-spacing:.02em;}
  .edit-meta{font-size:10.5px;color:var(--muted-txt);margin-top:8px;padding-top:8px;border-top:1px dashed var(--line-soft);letter-spacing:.01em;}
  .edit-history{margin-top:8px;}
  .edit-history summary{font-size:11px;color:var(--sage-deep);cursor:pointer;user-select:none;padding:3px 0;}
  .edit-history summary:hover{color:var(--ink);}
  .hist-list{margin-top:8px;max-height:280px;overflow-y:auto;padding-right:4px;}
  .hist-entry{padding:8px 10px;margin-bottom:6px;background:var(--surface-2);border-radius:3px;border-left:2px solid var(--sage);}
  .hist-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px;}
  .hist-by{font-size:11.5px;font-weight:600;color:var(--ink);}
  .hist-when{font-size:10px;color:var(--muted-txt);}
  .hist-changes{margin:0;padding-left:16px;}
  .hist-changes li{font-size:11px;color:var(--ink-soft);line-height:1.55;letter-spacing:.01em;}
  .gate-card select{width:100%;font-size:14px;padding:11px;margin-bottom:12px;border:1px solid var(--line-strong);border-radius:2px;background:#fff;}
  .list-table tbody tr{cursor:pointer;transition:background .12s;}
  .list-table tbody tr:hover{background:var(--surface-2);}
  .row-thumb{width:40px;height:40px;object-fit:cover;border-radius:2px;border:1px solid var(--line);display:block;}
  .row-thumb.placeholder{background:var(--surface-2);position:relative;}
  .row-thumb.placeholder::after{content:'—';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--line);}
  .cat-chip{display:inline-block;font-size:10.5px;padding:2px 9px;border:1px solid var(--line);border-radius:999px;color:var(--ink-soft);letter-spacing:.02em;background:var(--surface-2);}
  .empty-state{padding:50px 10px;text-align:center;color:var(--muted-txt);font-size:13px;letter-spacing:.02em;}
  .list-style-no{font-family:var(--f-mono);font-size:11.5px;color:var(--muted-txt);}
  .list-item-name{font-weight:500;color:var(--ink);}
  .list-sale-name{font-size:12px;color:var(--ink-soft);}
  .round-badge{display:inline-block;font-size:9.5px;padding:1px 8px;margin-left:6px;border-radius:999px;background:var(--sage-deep);color:#F2F0EA;letter-spacing:.03em;vertical-align:middle;font-weight:500;}
  .grp-row{cursor:pointer;}
  .grp-row.has-rounds td{background:linear-gradient(var(--surface-2),var(--surface-2));border-bottom:1px solid var(--line);}
  .grp-row.has-rounds td:first-child{box-shadow:inset 3px 0 0 var(--sage);}
  .grp-row.has-rounds:hover td{background:var(--surface-2);}
  .expand-hint{font-size:10px;color:var(--sage-deep);margin-left:8px;letter-spacing:.02em;white-space:nowrap;}
  .grp-row.open .expand-hint{color:var(--muted-txt);}
  .child-row{background:#FAF9F5;}
  .child-row.hidden{display:none;}
  .child-row td{font-size:12px;padding-top:7px;padding-bottom:7px;}
  .child-row td:first-child{box-shadow:inset 3px 0 0 var(--line-strong,#C7C2B2);}
  .round-tag{display:inline-block;font-family:var(--f-mono);font-size:10.5px;padding:1px 7px;border:1px solid var(--sage);border-radius:3px;color:var(--sage-deep);margin-left:14px;font-weight:500;}
  .sub-note{font-family:var(--f-sans);font-size:9px;color:var(--muted-txt);margin-left:4px;letter-spacing:.04em;}

  /* ---------- categories tab ---------- */
  .cat-toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px;}
  .table-scroll{overflow-x:auto;background:var(--surface);border:1px solid var(--line-soft);border-radius:2px;padding:8px 10px;}
  .cat-table td input{width:78px;}
  .backup-bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 18px;padding:14px 16px;background:var(--surface-2);border:1px solid var(--line);border-radius:2px;}
  .backup-label{font-size:10px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);margin-right:4px;}
  .backup-hint{font-size:11px;color:var(--muted-txt);flex-basis:100%;margin-top:2px;}
  .cat-table td:first-child input{width:158px;}
  .cat-table td:first-child{position:sticky;left:0;background:var(--surface);}
  .cat-table th:first-child{position:sticky;left:0;background:var(--surface);z-index:2;}
  .hint{color:var(--muted-txt);font-size:11.5px;margin-top:14px;letter-spacing:.02em;line-height:1.6;}

  /* ---------- toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:28px;transform:translate(-50%,20px);
    background:var(--ink);color:#F2F0EA;padding:11px 22px;border-radius:2px;
    font-size:12.5px;letter-spacing:.03em;opacity:0;pointer-events:none;transition:all .26s ease;z-index:100;
  }
  #toast.show{opacity:1;transform:translate(-50%,0);}

  /* ---------- login gate ---------- */
  #gate{position:fixed;inset:0;z-index:200;background:var(--paper);display:flex;align-items:center;justify-content:center;}
  #gate.hidden{display:none;}

  .gate-guide{font-size:12.5px;color:var(--muted-txt);margin:0 0 18px;line-height:1.5;letter-spacing:.01em;}
  .google-btn{width:100%;background:#fff;border:1px solid var(--line-strong,#C7C2B2);color:var(--ink);font-size:13.5px;padding:11px;display:flex;align-items:center;justify-content:center;}

  .gate-signout{width:100%;margin-top:10px;background:transparent;border:none;color:var(--muted-txt);font-size:11px;}

  .gate-sub{font-size:9.5px;letter-spacing:.32em;color:var(--muted-txt);text-transform:uppercase;margin:6px 0 26px;}
  .gate-card input{text-align:center;font-size:14px;padding:11px;margin-bottom:14px;letter-spacing:.1em;}
  .gate-card .btn{width:100%;padding:12px;}
  .gate-err{color:var(--clay);font-size:12px;min-height:17px;margin-bottom:6px;letter-spacing:.02em;}

  @media screen{ .print-sheet{display:none;} }

  table.ps td.l, table.ps th.l{text-align:left;}

  table.ps tfoot td, table.ps tr.tot td{background:#eceae4;font-weight:600;}

  .ps-imgrow{display:flex;gap:6px;margin-bottom:6px;}
  .ps-imgrow img{flex:1;min-width:0;height:120px;object-fit:contain;border:.5px solid #bbb;background:#fafafa;}
</style>

"],"users":["김준희 대표","정민혁 이사","디자인팀","생산팀","통합관리팀","마케팅팀"]}</script>
<script>
/* =========================================================
   르쏭드비 원가계산서 — 앱 로직
========================================================= */
const packFieldDefs = [['poly','폴리'],['hanger','옷걸이'],['box','박스'],['qualityTag','품질택'],['brandTag','브랜드택'],['tagRing','택고리'],['caseCost','케이스'],['dustbag','더스트백']];
const logFieldDefs  = [['inspection','검수'],['barcode','바코딩'],['qc','검품'],['packing','패킹'],['picking','피킹'],['shipping','택배비']];

/* ---- 시드 데이터 (엑셀에서 추출) ---- */
let SEED = {categories:[], sheets:[], seasons:['26SS'], users:[]};
try{ SEED = JSON.parse(document.getElementById('seed-data').textContent); }catch(e){ console.error('seed parse', e); }

const state = { categories:[], index:[], current:null, tab:'editor', seasons:[], seasonFilter:'', users:[], currentUser:'', sortKey:'updatedAt', sortDir:'desc' };
const mainEl = document.getElementById('main');

/* ---- 유틸 ---- */
function genId(p){ return (p||'id')+'_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7); }
function num(v){ const n=parseFloat(v); return isNaN(n)?0:n; }
function won(n){ return Math.round(n||0).toLocaleString('ko-KR'); }
function esc(v){ return String(v==null?'':v).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function setText(id,val){ const el=document.getElementById(id); if(el) el.textContent=val; }
function setPath(obj,path,value){ const p=path.split('.'); let c=obj; for(let i=0;i<p.length-1;i++)c=c[p[i]]; c[p[p.length-1]]=value; }
function toast(msg){ let el=document.getElementById('toast'); if(!el){el=document.createElement('div');el.id='toast';document.body.appendChild(el);} el.textContent=msg; el.classList.add('show'); clearTimeout(window.__tt); window.__tt=setTimeout(()=>el.classList.remove('show'),2200); }

/* =========================================================
   Supabase 데이터 계층
========================================================= */
let STORAGE_OK=false, supa=null;
function hasStorage(){ return !!supa; }
function initSupabase(){
  const c=window.APP_CONFIG||{};
  const ok=c.SUPABASE_URL && !c.SUPABASE_URL.includes('붙여넣기') && c.SUPABASE_ANON_KEY && !c.SUPABASE_ANON_KEY.includes('붙여넣기');
  if(!ok) return false;
  if(typeof window.supabase==='undefined'||!window.supabase.createClient) return false;
  try{ supa=window.supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}}); return true; }catch(e){ console.error(e); return false; }
}
function setConnBadge(ok){ const b=document.getElementById('conn-badge'); if(!b)return; b.innerHTML= ok?'<span class="conn-dot conn-ok"></span>공용 DB 연결됨':'<span class="conn-dot conn-bad"></span>DB 미연결'; }
async function kvGet(k){ if(!supa)return null; const {data,error}=await supa.from('app_kv').select('value').eq('key',k).maybeSingle(); if(error)throw error; return data?data.value:null; }
async function kvSet(k,v){ if(!supa)throw new Error('no db'); const {error}=await supa.from('app_kv').upsert({key:k,value:v},{onConflict:'key'}); if(error)throw error; return true; }
async function kvDel(k){ if(!supa)return; const {error}=await supa.from('app_kv').delete().eq('key',k); if(error)throw error; }

async function loadCategories(){ try{const v=await kvGet('categories');STORAGE_OK=true;return v;}catch(e){STORAGE_OK=false;return null;} }
async function saveCategories(c){ try{await kvSet('categories',c);STORAGE_OK=true;return true;}catch(e){STORAGE_OK=false;return null;} }
async function loadIndex(){ try{const v=await kvGet('sheet-index');STORAGE_OK=true;return Array.isArray(v)?v:[];}catch(e){STORAGE_OK=false;return [];} }
async function saveIndex(i){ try{await kvSet('sheet-index',i);STORAGE_OK=true;return true;}catch(e){STORAGE_OK=false;return null;} }
async function loadSeasons(){ try{const v=await kvGet('seasons');STORAGE_OK=true;return Array.isArray(v)?v:null;}catch(e){STORAGE_OK=false;return null;} }
async function saveSeasons(list){ try{await kvSet('seasons',list);STORAGE_OK=true;return true;}catch(e){STORAGE_OK=false;return null;} }
async function loadUsers(){ try{const v=await kvGet('users');STORAGE_OK=true;return Array.isArray(v)?v:null;}catch(e){STORAGE_OK=false;return null;} }
async function saveUsers(list){ try{await kvSet('users',list);STORAGE_OK=true;return true;}catch(e){STORAGE_OK=false;return null;} }
async function loadSheet(id){ try{const v=await kvGet('sheet:'+id);STORAGE_OK=true;return v;}catch(e){STORAGE_OK=false;return null;} }
async function saveSheetData(s){ try{await kvSet('sheet:'+s.id,s);STORAGE_OK=true;return true;}catch(e){STORAGE_OK=false;return null;} }
async function deleteSheetData(id){ try{await kvDel('sheet:'+id);}catch(e){} }

/* =========================================================
   데이터 모델
========================================================= */
function blankMaterialRow(){ return {section:'',vendor:'',spec:'',product:'',unitPrice:0,yardage:0,note:''}; }
function blankCategory(){ const c={id:genId('cat'),name:''}; [...packFieldDefs,...logFieldDefs].forEach(([k])=>c[k]=0); return c; }
function newBlankSheet(){
  const defSeason = (state.seasons && state.seasons.length) ? state.seasons[state.seasons.length-1] : '26SS';
  return {
    id:genId('sheet'), styleNo:'', baseStyleNo:'', round:1, season:defSeason, itemName:'', saleName:'', manager:'',
    createdAt:Date.now(), updatedAt:Date.now(), images:[], editLog:[], lastEditedBy:'', lastEditedAt:0,
    sizes:['S','M','L','XL'], colorRows:[{color:'',qty:{S:0,M:0,L:0,XL:0}}],
    patternCost:0, sampleCost:0,
    fabricRows:[blankMaterialRow()], trimRows:[blankMaterialRow()],
    labelRows:[{name:'메인라벨',unitPrice:98,qty:1},{name:'케어라벨',unitPrice:120,qty:1}],
    categoryId:'', packingOverride:{}, logisticsOverride:{},
    leaflet:57, returnExchange:50,
    laborFee:0, finishing:0, etc:0, devCost:0, devCostManual:false,
    expectedSalePrice:0, finalSalePrice:0,
  };
}

/* =========================================================
   계산
========================================================= */
function computeDevCost(s, qtyTotal){
  // 엑셀 수식과 동일: 개발비 = (패턴비 + 샘플비) / 총 생산수량
  if(s.devCostManual) return num(s.devCost);
  if(qtyTotal<=0) return 0;
  return (num(s.patternCost)+num(s.sampleCost))/qtyTotal;
}
function computeTotals(s){
  const fabricTotal=s.fabricRows.reduce((a,r)=>a+num(r.unitPrice)*num(r.yardage),0);
  const trimTotal=s.trimRows.reduce((a,r)=>a+num(r.unitPrice)*num(r.yardage),0);
  const labelTotal=s.labelRows.reduce((a,r)=>a+num(r.unitPrice)*num(r.qty),0);
  const pk=s.packingOverride||{};
  const packingTotal=packFieldDefs.reduce((a,[k])=>a+num(pk[k]),0)+num(s.leaflet)+num(s.returnExchange);
  const lg=s.logisticsOverride||{};
  const logisticsTotal=logFieldDefs.reduce((a,[k])=>a+num(lg[k]),0);
  const qtyTotal=s.colorRows.reduce((a,r)=>a+s.sizes.reduce((b,sz)=>b+num(r.qty[sz]),0),0);
  const devCost=computeDevCost(s, qtyTotal);
  const otherTotal=num(s.laborFee)+num(s.finishing)+num(s.etc)+devCost;
  const grand=fabricTotal+trimTotal+labelTotal+packingTotal+logisticsTotal+otherTotal;
  const vat=grand*1.1;
  const multiple=vat>0?num(s.finalSalePrice)/vat:0;
  return {fabricTotal,trimTotal,labelTotal,packingTotal,logisticsTotal,otherTotal,devCost,grand,vat,qtyTotal,multiple,totalProduction:vat*qtyTotal};
}

/* =========================================================
   효율화: 기존 시트에서 자동완성 후보 수집
   - 원단/부자재의 업체명·제품명·규격을 datalist로 제공
========================================================= */
let AUTOCOMPLETE={vendors:new Set(),products:new Set(),specs:new Set(),sections:new Set()};
function harvestAutocomplete(sheets){
  const A={vendors:new Set(),products:new Set(),specs:new Set(),sections:new Set()};
  (sheets||[]).forEach(s=>{
    [...(s.fabricRows||[]),...(s.trimRows||[])].forEach(r=>{
      if(r.vendor)A.vendors.add(r.vendor);
      if(r.product)A.products.add(r.product);
      if(r.spec!=null&&r.spec!=='')A.specs.add(String(r.spec));
      if(r.section)A.sections.add(r.section);
    });
  });
  AUTOCOMPLETE=A;
}
function datalistHTML(){
  const opt=(set)=>[...set].map(v=>`<option value="${esc(v)}">`).join('');
  return `<datalist id="dl-vendors">${opt(AUTOCOMPLETE.vendors)}</datalist>
          <datalist id="dl-products">${opt(AUTOCOMPLETE.products)}</datalist>
          <datalist id="dl-specs">${opt(AUTOCOMPLETE.specs)}</datalist>
          <datalist id="dl-sections">${opt(AUTOCOMPLETE.sections)}</datalist>`;
}

========================================================= */
function render(){
  document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.dataset.tab===state.tab));
  if(state.tab==='editor') mainEl.innerHTML=renderEditor();
  else if(state.tab==='search'){ mainEl.innerHTML=renderSearchShell(); renderSearchResults(); }
  else if(state.tab==='categories') mainEl.innerHTML=renderCategories();
  refreshAllComputed();
  setupSealDrag();
}
let SEAL_POS=null, SEAL_DRAG=null, SEAL_LISTENERS=false;
function setupSealDrag(){
  const seal=document.getElementById('cost-seal');
  const handle=document.getElementById('seal-handle');
  if(!seal||!handle) return;
  if(SEAL_POS){ seal.style.left=SEAL_POS.left+'px'; seal.style.top=SEAL_POS.top+'px'; seal.style.right='auto'; seal.style.bottom='auto'; }
  handle.onmousedown=(e)=>{
    const r=seal.getBoundingClientRect();
    SEAL_DRAG={dx:e.clientX-r.left, dy:e.clientY-r.top};
    seal.style.right='auto'; seal.style.bottom='auto';
    e.preventDefault();
  };
  if(!SEAL_LISTENERS){
    SEAL_LISTENERS=true;
    window.addEventListener('mousemove',(e)=>{
      const seal=document.getElementById('cost-seal');
      if(!SEAL_DRAG||!seal) return;
      let left=e.clientX-SEAL_DRAG.dx, top=e.clientY-SEAL_DRAG.dy;
      left=Math.max(4,Math.min(window.innerWidth-seal.offsetWidth-4,left));
      top=Math.max(4,Math.min(window.innerHeight-seal.offsetHeight-4,top));
      seal.style.left=left+'px'; seal.style.top=top+'px';
      SEAL_POS={left,top};
    });
    window.addEventListener('mouseup',()=>{ SEAL_DRAG=null; });
  }
}
function renderTab(){ render(); }

function refreshAllComputed(){
  const s=state.current; if(!s||state.tab!=='editor')return;
  s.fabricRows.forEach((r,i)=>setText('fabricRows-amt-'+i,won(num(r.unitPrice)*num(r.yardage))));
  s.trimRows.forEach((r,i)=>setText('trimRows-amt-'+i,won(num(r.unitPrice)*num(r.yardage))));
  s.labelRows.forEach((r,i)=>setText('labelRows-amt-'+i,won(num(r.unitPrice)*num(r.qty))));
  s.colorRows.forEach((r,i)=>setText('csz-rowtotal-'+i,s.sizes.reduce((a,sz)=>a+num(r.qty[sz]),0).toLocaleString('ko-KR')));
  s.sizes.forEach(sz=>setText('csz-coltotal-'+sz,s.colorRows.reduce((a,r)=>a+num(r.qty[sz]),0).toLocaleString('ko-KR')));
  const t=computeTotals(s);
  ['fabric','trim','label','packing','logistics','other'].forEach(k=>setText('subtotal-'+k,won(t[k+'Total'])));
  setText('sum-fabric',won(t.fabricTotal));setText('sum-trim',won(t.trimTotal));setText('sum-label',won(t.labelTotal));
  setText('sum-packing',won(t.packingTotal));setText('sum-logistics',won(t.logisticsTotal));setText('sum-other',won(t.otherTotal));
  // 개발비 자동계산 모드일 때 입력칸에 계산값 실시간 표시
  const devInput=document.getElementById('devcost-input');
  if(devInput && !s.devCostManual){ devInput.value=Math.round(t.devCost); }
  setText('sum-grand',won(t.grand));setText('sum-vat',won(t.vat));setText('sum-multiple',t.multiple.toFixed(2));
  setText('csz-grandtotal',t.qtyTotal.toLocaleString('ko-KR'));
  setText('insight-qty',t.qtyTotal.toLocaleString('ko-KR'));
  setText('insight-totalproduction',won(t.totalProduction));
  setText('seal-vat',won(t.vat));setText('seal-multiple',t.multiple.toFixed(2));setText('seal-final',won(num(s.finalSalePrice)));
}

  const s=state.current;

========================================================= */
function avgGrand(){ if(!state.index.length)return 0; return state.index.reduce((a,x)=>a+(x.grand||0),0)/state.index.length; }
function thisMonthCount(){ const n=new Date(); return state.index.filter(x=>{const d=new Date(x.updatedAt);return d.getMonth()===n.getMonth()&&d.getFullYear()===n.getFullYear();}).length; }
function renderSearchShell(){
  const cats=[...new Set(state.index.map(x=>x.categoryName).filter(Boolean))];
  const seasons=state.seasons||['26SS'];
  const seasonTabs=`<div class="season-tabs">
    <button class="season-tab ${!state.seasonFilter?'active':''}" data-action="season-filter" data-season="">전체 시즌</button>
    ${seasons.map(sea=>`<span class="season-tab-wrap"><button class="season-tab ${state.seasonFilter===sea?'active':''}" data-action="season-filter" data-season="${esc(sea)}">${esc(sea)}</button><button class="season-del" data-action="del-season" data-season="${esc(sea)}" title="${esc(sea)} 시즌 삭제">×</button></span>`).join('')}
    <button class="season-add" data-action="add-season" title="시즌 추가">＋ 시즌</button>
    <button class="season-add" data-action="manage-users" title="작업자 관리" style="margin-left:auto;">◍ 작업자 관리</button>
  </div>`;
  // 현재 필터에 맞는 통계
  const scoped = state.seasonFilter ? state.index.filter(x=>(x.season||'26SS')===state.seasonFilter) : state.index;
  const avg = scoped.length ? scoped.reduce((a,x)=>a+(x.grand||0),0)/scoped.length : 0;
  return `
  ${seasonTabs}
  <div class="search-toolbar">
    <input id="search-query" class="search-input" placeholder="스타일번호 · 품명 · 카테고리 검색">
    <select id="search-category" style="width:auto;"><option value="">전체 카테고리</option>${cats.map(c=>`<option>${esc(c)}</option>`).join('')}</select>
    <button class="btn" data-action="export-csv">CSV 내보내기</button>
  </div>
  <div class="stat-row">
    <div class="stat-card"><div class="stat-num">${scoped.length}</div><div class="stat-label">${state.seasonFilter?esc(state.seasonFilter)+' 품목':'등록 품목'}</div></div>
    <div class="stat-card"><div class="stat-num">${won(avg)}</div><div class="stat-label">평균 원가</div></div>
    <div class="stat-card"><div class="stat-num">${seasons.length}</div><div class="stat-label">등록 시즌</div></div>
  </div>
  <div id="search-results-list"></div>`;
}
function sortArrow(key){
  if(state.sortKey!==key) return '<span class="sort-arr">↕</span>';
  return state.sortDir==='asc'?'<span class="sort-arr on">↑</span>':'<span class="sort-arr on">↓</span>';
}
function renderSearchResults(){
  const q=(document.getElementById('search-query')?.value||'').toLowerCase();
  const cat=document.getElementById('search-category')?.value||'';
  const list=state.index.filter(x=>{
    const mq=!q||(x.styleNo||'').toLowerCase().includes(q)||(x.itemName||'').toLowerCase().includes(q)||(x.categoryName||'').toLowerCase().includes(q);
    const ms=!state.seasonFilter||(x.season||'26SS')===state.seasonFilter;
    return mq&&ms&&(!cat||x.categoryName===cat);
  });
  const c=document.getElementById('search-results-list'); if(!c)return;
  if(!list.length){ c.innerHTML='<div class="empty-state">검색 결과가 없습니다.</div>'; return; }

  // baseStyleNo(없으면 styleNo)로 묶기
  const groups={};
  list.forEach(x=>{
    const key=x.baseStyleNo||x.styleNo||x.id;
    (groups[key]=groups[key]||[]).push(x);
  });
  // 그룹별 대표값 계산 후 정렬
  function groupVal(key, sortKey){
    const rounds=groups[key];
    const head=rounds.slice().sort((a,b)=>(a.round||1)-(b.round||1)).slice(-1)[0];
    const totalQty=rounds.reduce((a,x)=>a+num(x.qtyTotal),0);
    let avgCost; const tq=totalQty;
    if(tq>0){ avgCost=rounds.reduce((a,x)=>a+num(x.vat)*num(x.qtyTotal),0)/tq; } else { avgCost=rounds.reduce((a,x)=>a+num(x.vat),0)/rounds.length; }
    switch(sortKey){
      case 'styleNo': return (head.styleNo||'').toLowerCase();
      case 'itemName': return (head.itemName||'').toLowerCase();
      case 'saleName': return (head.saleName||'').toLowerCase();
      case 'categoryName': return (head.categoryName||'').toLowerCase();
      case 'vat': return avgCost;
      case 'qtyTotal': return totalQty;
      case 'multiple': return num(head.multiple);
      case 'updatedAt': default: return Math.max(...rounds.map(x=>x.updatedAt||0));
    }
  }
  const sk=state.sortKey||'updatedAt', sd=state.sortDir==='asc'?1:-1;
  const groupKeys=Object.keys(groups).sort((a,b)=>{
    const va=groupVal(a,sk), vb=groupVal(b,sk);
    if(typeof va==='string'||typeof vb==='string'){ return String(va).localeCompare(String(vb))*sd; }
    return (va-vb)*sd;
  });

  const rowsHTML=groupKeys.map(key=>{
    const rounds=groups[key].slice().sort((a,b)=>(a.round||1)-(b.round||1));
    const multi=rounds.length>1;
    const totalQty=rounds.reduce((a,x)=>a+num(x.qtyTotal),0);
    // 가중평균 실현원가 = Σ(원가×수량) / Σ수량  (수량 없으면 단순평균)
    let avgCost;
    if(totalQty>0){ avgCost=rounds.reduce((a,x)=>a+num(x.vat)*num(x.qtyTotal),0)/totalQty; }
    else { avgCost=rounds.reduce((a,x)=>a+num(x.vat),0)/rounds.length; }
    const head=rounds[rounds.length-1]; // 대표(최신 차수)
    const thumb=rounds.map(r=>r.thumb).find(Boolean);

    const groupRow=`<tr class="grp-row has-rounds" data-action="toggle-group" data-key="${esc(key)}">
      <td>${thumb?`<img class="row-thumb" src="${thumb}">`:'<div class="row-thumb placeholder"></div>'}</td>
      <td><span class="list-style-no">${esc(head.styleNo)||'-'}</span> <span class="round-badge">↻ ${rounds.length}차수</span></td>
      <td><span class="list-item-name">${esc(head.itemName)||'-'}</span> ${head.season?`<span class="season-chip">${esc(head.season)}</span>`:''} <span class="expand-hint" data-key="${esc(key)}">▸ 펼치기</span></td>
      <td><span class="list-sale-name">${esc(head.saleName)||'<span style=\"color:var(--muted-txt)\">-</span>'}</span></td>
      <td class="readout" data-m="원가">${won(avgCost)}<span class="sub-note">평균</span></td>
      <td class="readout" data-m="수량">${totalQty.toLocaleString('ko-KR')}<span class="sub-note">누적</span></td>
      <td class="readout" data-m="배수">${head.multiple?head.multiple.toFixed(2):'-'}</td>
      <td class="readout" data-m="수정일" style="color:var(--muted-txt)">${new Date(head.updatedAt).toLocaleDateString('ko-KR')}</td>
    </tr>`;

    // 차수 상세행 (여러 차수일 때만, 기본 접힘)
    const childRows= multi ? rounds.map(r=>`<tr class="child-row hidden" data-group="${esc(key)}" data-action="load-sheet" data-id="${r.id}">
      <td></td>
      <td><span class="round-tag">${r.round||1}차</span></td>
      <td style="color:var(--muted-txt)">${(r.round===1)?'초도':(r.round===2?'리오더':'재생산')}</td>
      <td style="color:var(--muted-txt);font-size:11px;">${esc(r.saleName||'')}</td>
      <td class="readout" data-m="원가">${won(r.vat)}</td>
      <td class="readout" data-m="수량">${num(r.qtyTotal).toLocaleString('ko-KR')}</td>
      <td class="readout" data-m="배수">${r.multiple?r.multiple.toFixed(2):'-'}</td>
      <td class="readout" data-m="수정일" style="color:var(--muted-txt)">${new Date(r.updatedAt).toLocaleDateString('ko-KR')}</td>
    </tr>`).join('') : '';

    // 단일 차수면 그룹행 자체가 바로 열리도록 load-sheet 처리
    const singleOpen = !multi ? `` : '';
    if(!multi){
      return `<tr class="grp-row" data-action="load-sheet" data-id="${head.id}">
        <td>${thumb?`<img class="row-thumb" src="${thumb}">`:'<div class="row-thumb placeholder"></div>'}</td>
        <td><span class="list-style-no">${esc(head.styleNo)||'-'}</span></td>
        <td><span class="list-item-name">${esc(head.itemName)||'-'}</span> ${head.season?`<span class="season-chip">${esc(head.season)}</span>`:''}</td>
        <td><span class="list-sale-name">${esc(head.saleName)||'<span style=\"color:var(--muted-txt)\">-</span>'}</span></td>
        <td class="readout" data-m="원가">${won(head.vat)}</td>
        <td class="readout" data-m="수량">${num(head.qtyTotal).toLocaleString('ko-KR')}</td>
        <td class="readout" data-m="배수">${head.multiple?head.multiple.toFixed(2):'-'}</td>
        <td class="readout" data-m="수정일" style="color:var(--muted-txt)">${new Date(head.updatedAt).toLocaleDateString('ko-KR')}</td>
      </tr>`;
    }
    return groupRow+childRows;
  }).join('');

  c.innerHTML=`<div class="table-scroll"><table class="list-table">
    <thead><tr><th></th>
      <th class="sortable" data-action="sort" data-key="styleNo">Style No.${sortArrow('styleNo')}</th>
      <th class="sortable" data-action="sort" data-key="itemName">품명${sortArrow('itemName')}</th>
      <th class="sortable" data-action="sort" data-key="saleName">판매상품명${sortArrow('saleName')}</th>
      <th class="sortable num" data-action="sort" data-key="vat">원가(VAT)${sortArrow('vat')}</th>
      <th class="sortable num" data-action="sort" data-key="qtyTotal">수량${sortArrow('qtyTotal')}</th>
      <th class="sortable num" data-action="sort" data-key="multiple">배수${sortArrow('multiple')}</th>
      <th class="sortable num" data-action="sort" data-key="updatedAt">수정일${sortArrow('updatedAt')}</th>
    </tr></thead>
    <tbody>${rowsHTML}</tbody>
  </table></div>

/* 수정 내용 추적: 저장 시점에 이전 스냅샷과 비교해 '무엇을 어떻게' 바꿨는지 문장으로 남긴다. */
function snapshotForDiff(s){
  const t=computeTotals(s);
  const pk=s.packingOverride||{}, lg=s.logisticsOverride||{};
  return {
    styleNo:s.styleNo||'', itemName:s.itemName||'', saleName:s.saleName||'', season:s.season||'', round:s.round||1,
    manager:s.manager||'', categoryId:s.categoryId||'', finalSalePrice:num(s.finalSalePrice),
    patternCost:num(s.patternCost), sampleCost:num(s.sampleCost), laborFee:num(s.laborFee), finishing:num(s.finishing), etc:num(s.etc),
    leaflet:num(s.leaflet), returnExchange:num(s.returnExchange),
    fabricCount:(s.fabricRows||[]).length, trimCount:(s.trimRows||[]).length, labelCount:(s.labelRows||[]).length,
    imageCount:(s.images||[]).length,
    qtyTotal:t.qtyTotal, grand:Math.round(t.grand), vat:Math.round(t.vat),
    packing:JSON.stringify(pk), logistics:JSON.stringify(lg)
  };
}
function diffSheets(before, after){
  if(!before) return [];
  const chg=[];
  const won2=(v)=>Number(v).toLocaleString('ko-KR')+'원';
  const catName=(id)=>{ const c=state.categories.find(x=>x.id===id); return c?c.name:'(없음)'; };
  const label={
    styleNo:'스타일번호', itemName:'품명', saleName:'판매상품명', season:'시즌', round:'차수',
    manager:'담당자', finalSalePrice:'최종판매가', patternCost:'패턴비', sampleCost:'샘플비',
    laborFee:'임가공비', finishing:'시야게', etc:'기타비용', leaflet:'리플렛', returnExchange:'교환반품비',
    qtyTotal:'총수량'
  };
  // 텍스트/숫자 필드
  ['styleNo','itemName','saleName','season','manager'].forEach(k=>{
    if((before[k]||'')!==(after[k]||'')) chg.push(`${label[k]}: "${before[k]||'-'}" → "${after[k]||'-'}"`);
  });
  ['round','finalSalePrice','patternCost','sampleCost','laborFee','finishing','etc','leaflet','returnExchange','qtyTotal'].forEach(k=>{
    if(num(before[k])!==num(after[k])){
      const isMoney=!['round','qtyTotal'].includes(k);
      chg.push(`${label[k]}: ${isMoney?won2(before[k]):before[k]} → ${isMoney?won2(after[k]):after[k]}`);
    }
  });
  // 카테고리
  if((before.categoryId||'')!==(after.categoryId||'')) chg.push(`구분: ${catName(before.categoryId)} → ${catName(after.categoryId)}`);
  // 행 개수 변화
  if(before.fabricCount!==after.fabricCount) chg.push(`원단 항목 ${before.fabricCount}→${after.fabricCount}개`);
  if(before.trimCount!==after.trimCount) chg.push(`부자재 항목 ${before.trimCount}→${after.trimCount}개`);
  if(before.labelCount!==after.labelCount) chg.push(`라벨 항목 ${before.labelCount}→${after.labelCount}개`);
  if(before.imageCount!==after.imageCount) chg.push(`이미지 ${before.imageCount}→${after.imageCount}장`);
  // 포장/물류 단가 세부 변화
  if(before.packing!==after.packing) chg.push('포장자재 단가 변경');
  if(before.logistics!==after.logistics) chg.push('물류비 단가 변경');
  // 총합계/VAT 변화 (다른 변경의 결과지만 요약으로 유용)
  if(before.grand!==after.grand) chg.push(`원가합계 ${won2(before.grand)} → ${won2(after.grand)}`);
  return chg;
}
async function saveSheet(){
  const s=state.current; s.updatedAt=Date.now();
  if(!s.baseStyleNo) s.baseStyleNo = s.styleNo || '';   // 차수 묶음 키 기본값
  if(!s.round) s.round = 1;
  // 수정 내용 계산 (이전 스냅샷 대비)
  const after=snapshotForDiff(s);
  const isNew = !state.index.some(x=>x.id===s.id);
  const changes = isNew ? ['신규 작성'] : diffSheets(state.editorSnapshot, after);
  // 수정자 로그
  s.lastEditedBy = state.currentUser || '(미지정)';
  s.lastEditedAt = s.updatedAt;
  s.editLog = Array.isArray(s.editLog) ? s.editLog : [];
  // 변경사항이 있을 때만 기록 (단순 재저장은 기록 생략)
  if(changes.length){
    s.editLog.push({by:s.lastEditedBy, at:s.updatedAt, changes:changes});
    if(s.editLog.length>30) s.editLog = s.editLog.slice(-30);
  }
  const cat=state.categories.find(c=>c.id===s.categoryId);
  const t=computeTotals(s);
  const ok=await saveSheetData(s);
  const summary={id:s.id,styleNo:s.styleNo,baseStyleNo:s.baseStyleNo,round:s.round,season:s.season||'',itemName:s.itemName,saleName:s.saleName||'',categoryName:cat?cat.name:'',grand:t.grand,vat:t.vat,multiple:t.multiple,qtyTotal:t.qtyTotal,finalSalePrice:s.finalSalePrice,updatedAt:s.updatedAt,lastEditedBy:s.lastEditedBy,thumb:s.images[0]||null};
  const i=state.index.findIndex(x=>x.id===summary.id);
  if(i>=0)state.index[i]=summary; else state.index.unshift(summary);
  await saveIndex(state.index);
  state.editorSnapshot=after;   // 저장 후 스냅샷 갱신 (다음 수정 기준)
  toast(ok?('저장되었습니다 · '+s.lastEditedBy+(changes.length&&!isNew?' · '+changes.length+'건 변경':'')):'저장 실패 — DB 연결을 확인하세요');
  render();
}

function delSeason(name, btn){
  if(!name) return;
  const used = state.index.filter(x=>(x.season||'26SS')===name).length;
  if(used>0){
    if(btn && btn.dataset.armed!=='1'){
      btn.dataset.armed='1'; const o=btn.textContent; btn.dataset.o=o; btn.textContent='!'; btn.title=name+' 시즌에 '+used+'개 상품이 있습니다. 다시 누르면 시즌만 목록에서 제거(상품은 유지)';
      clearTimeout(btn.__t); btn.__t=setTimeout(()=>{btn.dataset.armed='0';btn.textContent=btn.dataset.o;},4000);
      return;
    }

  state.seasons=state.seasons.filter(s=>s!==name);
  saveSeasons(state.seasons);
  if(state.seasonFilter===name) state.seasonFilter='';

function addRound(){
  const src=state.current;

  // 같은 baseStyleNo 중 가장 높은 차수 + 1
  let maxRound = 1;
  state.index.forEach(x=>{ if((x.baseStyleNo||x.styleNo)===base && (x.round||1)>maxRound) maxRound=x.round||1; });
  const c=JSON.parse(JSON.stringify(src));
  c.id=genId('sheet');
  c.baseStyleNo=base;
  c.styleNo=src.styleNo||base;
  c.round=maxRound+1;
  c.createdAt=Date.now(); c.updatedAt=Date.now();
  // 리오더는 일회성 개발비용이 없음 → 패턴비/샘플비 0, 개발비 자동(=0)
  c.patternCost=0; c.sampleCost=0; c.devCost=0; c.devCostManual=false;

  c.colorRows=c.colorRows.map(r=>{ const q={}; c.sizes.forEach(sz=>q[sz]=0); return {color:r.color, qty:q}; });
  state.current=c; state.tab='editor'; render();
  toast(c.round+'차(리오더) 계산서를 만들었습니다. 수량만 새로 입력한 뒤 저장하세요. (패턴·샘플비 0, 단가·이미지 유지)');

function renderEditHistory(s){
  if(!s.lastEditedBy && !(s.editLog&&s.editLog.length)) return '';
  const log=(s.editLog||[]).slice().reverse();  // 최신 먼저
  const head=`<div class="edit-meta">최근 수정: <b>${esc(s.lastEditedBy||'-')}</b> · ${s.lastEditedAt?new Date(s.lastEditedAt).toLocaleString('ko-KR'):''}</div>`;
  if(!log.length) return head;
  const items=log.slice(0,8).map(e=>{
    const when=e.at?new Date(e.at).toLocaleString('ko-KR'):'';
    const changes=(e.changes&&e.changes.length)?e.changes:['(변경 내역 없음)'];
    return `<div class="hist-entry">
      <div class="hist-head"><span class="hist-by">${esc(e.by||'-')}</span><span class="hist-when">${when}</span></div>
      <ul class="hist-changes">${changes.map(c=>`<li>${esc(c)}</li>`).join('')}</ul>
    </div>`;
  }).join('');
  return `${head}
    <details class="edit-history">
      <summary>수정 이력 ${log.length}건 보기</summary>
      <div class="hist-list">${items}</div>
    </details>`;
}

async function exportBackup(){
  toast('백업 데이터를 모으는 중…');
  const backup={ _meta:{ app:'lcdv-cost', version:1, exportedAt:new Date().toISOString(), exportedBy:state.currentUser||'' },
    categories:state.categories, index:state.index, seasons:state.seasons, users:state.users, sheets:{} };
  // 각 시트 본문 수집 (DB 우선, 실패 시 시드)
  for(const x of state.index){
    let sh=null;
    try{ sh=await loadSheet(x.id); }catch(e){}
    if(!sh) sh=SEED.sheets.find(s=>s.id===x.id);
    if(sh) backup.sheets[x.id]=sh;
  }
  const json=JSON.stringify(backup,null,2);
  const blob=new Blob([json],{type:'application/json'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  const stamp=new Date().toISOString().slice(0,10);
  a.href=url; a.download=`lcdv_backup_${stamp}.json`;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1000);
  toast('백업 파일을 다운로드했습니다 ('+Object.keys(backup.sheets).length+'개 상품)');
}

async function importBackup(file){
  if(!file) return;
  let backup;
  try{ backup=JSON.parse(await file.text()); }catch(e){ toast('파일을 읽을 수 없습니다 (JSON 아님)'); return; }
  if(!backup || !backup.categories || !backup.sheets){ toast('올바른 백업 파일이 아닙니다'); return; }
  const cnt=Object.keys(backup.sheets).length;
  const ok=confirm(`백업을 복원하면 현재 DB의 데이터가 이 백업 내용으로 덮어써집니다.\n\n백업 시점: ${backup._meta?backup._meta.exportedAt:'알 수 없음'}\n상품 ${cnt}개, 카테고리 ${backup.categories.length}개\n\n계속하시겠습니까?`);
  if(!ok) return;
  if(!hasStorage()){ toast('DB에 연결되어 있지 않아 복원할 수 없습니다'); return; }
  toast('복원 중… 잠시만 기다리세요');
  try{
    await saveCategories(backup.categories);
    if(Array.isArray(backup.seasons)) await saveSeasons(backup.seasons);
    if(Array.isArray(backup.users)) await saveUsers(backup.users);
    for(const id in backup.sheets){ await saveSheetData(backup.sheets[id]); }
    if(Array.isArray(backup.index)) await saveIndex(backup.index);
    toast('복원 완료 ('+cnt+'개 상품). 새로고침합니다.');
    setTimeout(()=>location.reload(),1200);
  }catch(e){ console.error(e); toast('복원 중 오류가 발생했습니다'); }
}

  const h=['Style No','품명','카테고리','원가합계','VAT포함','배수','최종판매가','수정일'];

}

/* 이미지 압축: 장당 목표 용량(기본 190KB) 이하가 되도록
   해상도(최대 폭)와 JPEG 품질을 단계적으로 낮춰가며 맞춘다.
   base64 data URL 은 원본보다 약 1.37배 커지므로, 바이트 기준으로 계산해 마진을 둔다. */
function dataUrlBytes(dataUrl){
  const i = dataUrl.indexOf(',');
  const b64 = dataUrl.slice(i+1);
  return Math.floor(b64.length * 3 / 4);   // base64 → 실제 바이트
}
function drawToDataUrl(img, maxW, q){
  let w = img.width, h = img.height;
  if(w > maxW){ h = Math.round(h * (maxW / w)); w = maxW; }
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  cv.getContext('2d').drawImage(img, 0, 0, w, h);
  return cv.toDataURL('image/jpeg', q);
}
function compressImage(file, targetBytes){
  targetBytes = targetBytes || 190*1024;
  return new Promise((res, rej)=>{
    const r = new FileReader();
    r.onload = ev=>{
      const im = new Image();
      im.onload = ()=>{
        const widths = [1000, 860, 720, 600, 500, 420];
        const qualities = [0.72, 0.6, 0.5, 0.42, 0.35];
        let best = null;
        for(const w of widths){
          for(const q of qualities){
            const out = drawToDataUrl(im, w, q);
            const bytes = dataUrlBytes(out);
            best = out; // 항상 최신 결과를 보관 (마지막 = 가장 작은 조합)
            if(bytes <= targetBytes){ res(out); return; }
          }
        }
        res(best); // 목표에 못 미쳐도 가능한 가장 작은 버전 반환
      };
      im.onerror = rej;
      im.src = ev.target.result;
    };
    r.onerror = rej;
    r.readAsDataURL(file);
  });
}

async function handleImageFiles(files){
  for(const f of Array.from(files)){
    if(!f.type.startsWith('image/'))continue;
    if(state.current.images.length>=4){ toast('이미지는 최대 4장'); break; }
    try{
      const out = await compressImage(f, 190*1024);
      const kb = Math.round(dataUrlBytes(out)/1024);
      state.current.images.push(out);
      toast('이미지 추가됨 (약 '+kb+'KB로 압축)');
    }catch(e){ console.error(e); toast('이미지 처리 실패'); }
  }
  renderTab();
}

function armDelete(btn,fn,label){
  if(btn.dataset.armed==='1'){ fn(); return; }
  btn.dataset.armed='1'; btn.dataset.orig=btn.textContent; btn.textContent=label||'한번 더 클릭'; btn.classList.add('danger-armed');
  clearTimeout(btn.__t); btn.__t=setTimeout(()=>{btn.dataset.armed='0';btn.textContent=btn.dataset.orig;btn.classList.remove('danger-armed');},4000);
}

async function seedFirstRun(){
  // 카테고리 + 39개 시트를 공용 DB에 최초 1회 업로드
  await saveCategories(JSON.parse(JSON.stringify(SEED.categories)));
  const idx=[];
  for(const raw of SEED.sheets){
    const s=JSON.parse(JSON.stringify(raw));
    await saveSheetData(s);
    const t=computeTotals(s);
    const cat=SEED.categories.find(c=>c.id===s.categoryId);
    idx.push({id:s.id,styleNo:s.styleNo,baseStyleNo:s.baseStyleNo||s.styleNo,round:s.round||1,season:s.season||'',itemName:s.itemName,saleName:s.saleName||'',categoryName:cat?cat.name:'',grand:t.grand,vat:t.vat,multiple:t.multiple,qtyTotal:t.qtyTotal,finalSalePrice:s.finalSalePrice,updatedAt:s.updatedAt,thumb:null});
  }
  await saveIndex(idx);
  return idx;
}

async function loadAllData(){
  let cats=null;
  try{ cats=await loadCategories(); }catch(e){}
  let firstRun=false;
  if(!cats||!Array.isArray(cats)||!cats.length){ firstRun=true; cats=JSON.parse(JSON.stringify(SEED.categories)); }
  state.categories=cats;

  // 시즌 목록 로드 (없으면 시드 기본값)
  let seasons=null;
  try{ seasons=await loadSeasons(); }catch(e){}
  if(!seasons||!seasons.length){ seasons=(SEED.seasons&&SEED.seasons.length)?SEED.seasons.slice():['26SS']; if(hasStorage()){ try{ await saveSeasons(seasons); }catch(e){} } }
  state.seasons=seasons;

  // 작업자 목록 로드
  let users=null;
  try{ users=await loadUsers(); }catch(e){}
  if(!users||!users.length){ users=(SEED.users&&SEED.users.length)?SEED.users.slice():[]; if(hasStorage()&&users.length){ try{ await saveUsers(users); }catch(e){} } }
  state.users=users;

  let idx=[];
  try{ idx=await loadIndex(); }catch(e){}
  if(!Array.isArray(idx)) idx=[];

  if(firstRun && hasStorage()){
    // 공용 DB에 아직 아무것도 없음 → 39개 시트 시드 업로드
    try{ idx=await seedFirstRun(); }catch(e){ console.error('seed fail',e); }
  } else if(firstRun && !hasStorage()){
    // DB 미연결 미리보기: 화면에서만 시드 보여주기
    idx=SEED.sheets.map(s=>{ const t=computeTotals(s); const cat=SEED.categories.find(c=>c.id===s.categoryId); return {id:s.id,styleNo:s.styleNo,baseStyleNo:s.baseStyleNo||s.styleNo,round:s.round||1,season:s.season||'',itemName:s.itemName,saleName:s.saleName||'',categoryName:cat?cat.name:'',grand:t.grand,vat:t.vat,multiple:t.multiple,qtyTotal:t.qtyTotal,finalSalePrice:s.finalSalePrice,updatedAt:s.updatedAt,thumb:null}; });
  }
  state.index=idx;

  // 오래된 DB 인덱스 자기치유 + 레거시 리오더 병합
  if(idx.length && hasStorage()){
    const needsHeal = idx.some(x =>
      x.qtyTotal===undefined || x.baseStyleNo===undefined || x.round===undefined || x.multiple===undefined
      || /[-(]?리오더|리오더\)|\(2\)|-2$/.test((x.styleNo||'')+(x.itemName||''))
    );
    if(needsHeal){
      let changed=false;
      for(const x of idx){
        let sh=null;
        try{ sh=await loadSheet(x.id); }catch(e){}
        if(!sh) sh=SEED.sheets.find(s=>s.id===x.id);
        if(!sh) continue;

        // --- 레거시 리오더 정규화 ---
        const raw=(sh.styleNo||'')+' '+(sh.itemName||'');
        const isReorder = /리오더|\(2\)/.test(raw) || /-2$/.test(sh.styleNo||'');
        if(isReorder && (sh.baseStyleNo===undefined || sh.round===undefined || /리오더|-리오더|\(2\)|-2$/.test(sh.styleNo||''))){
          const base=(sh.styleNo||'').replace(/-리오더$/,'').replace(/-2$/,'').trim();
          sh.baseStyleNo=base;
          sh.styleNo=base;
          sh.itemName=(sh.itemName||'').replace(/\s*\(리오더\)\s*/,'').replace(/\s*\(2\)\s*/,'').trim();
          sh.round=sh.round&&sh.round>1?sh.round:2;
          sh.patternCost=0; sh.sampleCost=0; sh.devCost=0; sh.devCostManual=false;
          try{ await saveSheetData(sh); }catch(e){}
        }
        if(sh.baseStyleNo===undefined) sh.baseStyleNo=sh.styleNo;
        if(sh.round===undefined) sh.round=1;

        // --- 인덱스 요약 재계산 ---
        const t=computeTotals(sh);
        x.styleNo=sh.styleNo; x.itemName=sh.itemName; x.saleName=sh.saleName||x.saleName||'';
        x.baseStyleNo=sh.baseStyleNo; x.round=sh.round; x.season=sh.season||x.season||'26SS';
        x.qtyTotal=t.qtyTotal; x.multiple=t.multiple; x.grand=t.grand; x.vat=t.vat;
        changed=true;
      }
      if(changed){ try{ await saveIndex(idx); }catch(e){} }
    }
  }

  if(idx.length){
    let loaded=null;
    if(hasStorage()){ try{ loaded=await loadSheet(idx[0].id); }catch(e){} }
    if(!loaded) loaded=SEED.sheets.find(x=>x.id===idx[0].id);
    state.current=loaded||newBlankSheet();
  } else {
    state.current=newBlankSheet();
  }
  // 자동완성 후보는 시드 전체에서 수집
  harvestAutocomplete(SEED.sheets);
}

  catch(e){ console.error(e); state.categories=JSON.parse(JSON.stringify(SEED.categories)); state.current=newBlankSheet(); state.index=[]; harvestAutocomplete(SEED.sheets); }
  render();
  setConnBadge(hasStorage()&&STORAGE_OK);
  const cu=document.getElementById('current-user');
  if(cu && state.currentUser){ cu.textContent='◍ '+state.currentUser; }
  if(!hasStorage()) showBanner('공용 DB가 설정되지 않았습니다. 지금은 저장되지 않는 미리보기 상태입니다. (설정 구역에 Supabase 키 입력 필요)');
  else if(!STORAGE_OK) showBanner('공용 DB에 연결하지 못했습니다. 인터넷 연결과 app_kv 테이블 생성 여부를 확인하세요.');
}

/* ---- 로그인 게이트 ---- */
const SESSION_KEY='lcdv_authed';
const USER_KEY='lcdv_user';
function bootApp(){ init(); }
function gateUserOptions(){
  const sel=document.getElementById('gate-user');
  if(!sel) return;
  const users=(state.users&&state.users.length)?state.users:(SEED.users||[]);
  sel.innerHTML='<option value="">— 작업자 선택 —</option>'+users.map(u=>`<option value="${u.replace(/"/g,'&quot;')}">${u}</option>`).join('');
  try{ const last=sessionStorage.getItem(USER_KEY); if(last) sel.value=last; }catch(e){}
}

async function showGate(){
  const gate=document.getElementById('gate');
  const err=document.getElementById('gate-err');
  const stepLogin=document.getElementById('gate-step-login');
  const stepUser=document.getElementById('gate-step-user');
  const googleBtn=document.getElementById('gate-google');
  const enterBtn=document.getElementById('gate-enter');
  const signoutBtn=document.getElementById('gate-signout');
  const userSel=document.getElementById('gate-user');
  const welcome=document.getElementById('gate-welcome');

  // Supabase 클라이언트 준비 (auth 사용에 필요)
  initSupabase();

  // 구글 로그인이 설정되지 않았거나 DB 미연결이면: 로그인 없이 통과 (오프라인/개발 모드)
  if(!supa){
    gate.classList.add('hidden');
    bootApp();
    return;
  }

  gate.classList.remove('hidden');

  // 현재 로그인 세션 확인 (구글 리디렉션 후 복귀 포함)
  let session=null;
  try{ const { data } = await supa.auth.getSession(); session=data.session; }catch(e){}

  function toLoginStep(){
    stepLogin.style.display='';
    stepUser.style.display='none';
    err.textContent='';
  }
  function toUserStep(email){
    stepLogin.style.display='none';
    stepUser.style.display='';
    err.textContent='';
    if(welcome) welcome.textContent = email ? (email+' 로그인됨 · 작업자를 선택하세요') : '작업자를 선택하세요';
    gateUserOptions();
    if(userSel) userSel.focus();
  }

  function emailAllowed(email){
    const list=(window.APP_CONFIG&&window.APP_CONFIG.ALLOWED_EMAILS)||[];
    if(!list.length) return true;                       // 목록 비어있으면 제한 없음
    return list.map(e=>e.toLowerCase()).includes((email||'').toLowerCase());
  }

  if(session && session.user){
    const email=session.user.email||'';
    if(emailAllowed(email)){
      // 허용된 계정 → 작업자 선택 단계로
      toUserStep(email);
    } else {
      // 허용되지 않은 계정 → 로그아웃 후 차단 안내
      try{ await supa.auth.signOut(); }catch(e){}
      toLoginStep();
      err.textContent = email+' 계정은 접근 권한이 없습니다. 회사 계정으로 로그인하세요.';
    }
  } else {
    // 로그인 필요
    toLoginStep();
  }

  // 구글 로그인 버튼
  if(googleBtn && !googleBtn.__wired){
    googleBtn.__wired=true;
    googleBtn.addEventListener('click', async ()=>{
      err.textContent='';
      try{
        const redirectTo = window.location.origin + window.location.pathname;
        const { error } = await supa.auth.signInWithOAuth({
          provider:'google',
          options:{ redirectTo }
        });
        if(error){ err.textContent='로그인 오류: '+error.message; }
      }catch(e){ err.textContent='로그인을 시작할 수 없습니다.'; }
    });
  }

  // 입장 버튼 (작업자 선택 후)
  if(enterBtn && !enterBtn.__wired){
    enterBtn.__wired=true;
    enterBtn.addEventListener('click', ()=>{
      const who=(userSel&&userSel.value)||'';
      if(!who){ err.textContent='작업자를 선택해주세요.'; return; }
      state.currentUser=who;
      try{ sessionStorage.setItem(USER_KEY,who); }catch(e){}
      gate.classList.add('hidden');
      bootApp();
    });
  }

  // 다른 계정으로 로그인 (로그아웃)
  if(signoutBtn && !signoutBtn.__wired){
    signoutBtn.__wired=true;
    signoutBtn.addEventListener('click', async ()=>{
      try{ await supa.auth.signOut(); }catch(e){}
      try{ sessionStorage.removeItem(USER_KEY); }catch(e){}
      toLoginStep();
    });
  }
}

/* Supabase SDK 를 동적으로 로드한다.
   - 외부 <script src> 를 HTML에 두지 않아 아티팩트 로더가 멈추지 않는다.
   - 로드 실패/지연 시에도 최대 대기 후 미연결 모드로 진행. */
function loadSDK(cb){
  if(typeof window.supabase!=='undefined' && window.supabase.createClient){ cb(); return; }
  const cfg=window.APP_CONFIG||{};
  const configured = cfg.SUPABASE_URL && !cfg.SUPABASE_URL.includes('붙여넣기');
  if(!configured){ cb(); return; }           // 키가 없으면 미연결 모드로 바로 진행
  let done=false;
  const finish=()=>{ if(done)return; done=true; cb(); };
  const s=document.createElement('script');
  s.src='https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
  s.onload=finish;
  s.onerror=()=>{ window.__sdkFailed=true; finish(); };
  document.head.appendChild(s);
  setTimeout(finish, 4000);                   // 4초 안에 안 오면 그냥 진행
}
function startWhenReady(){ loadSDK(showGate); }
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', startWhenReady); }
else { startWhenReady(); }

</script>
